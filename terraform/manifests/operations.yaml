apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: operations
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./k8s/operations
  targetNamespace: system
  decryption:
    provider: sops
    secretRef:
      name: sops-credentials
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: environment
  prune: true
  sourceRef:
    kind: GitRepository
    name: k8s-playground