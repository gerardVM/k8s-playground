apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: products
  namespace: flux-system
spec:
  dependsOn:
    - name: operations
  interval: 10m0s
  path: ./k8s/products
  decryption:
    provider: sops
    secretRef:
      name: sops-credentials
  prune: true
  sourceRef:
    kind: GitRepository
    name: k8s-playground
