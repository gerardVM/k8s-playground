apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: traefik
  namespace: system
spec:
  interval: 1h
  url: https://traefik.github.io/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: system
spec:
  interval: 1h
  chart:
    spec:
      chart: traefik
      version: "v35.4.0"
      sourceRef:
        kind: HelmRepository
        name: traefik
      interval: 10m
  values:
    deployment:
      replicas: 1
    updateStrategy:
      type: Recreate
      rollingUpdate:
    globalArguments:
    logs:
      access:
        enabled: true
    ingressRoute:
      dashboard:
        enabled: true
    service:
      type: NodePort
    ports:
      web:
        nodePort: 30000
      websecure:
        nodePort: 30443
