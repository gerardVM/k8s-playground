apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metrics-server
  namespace: system
spec:
  interval: 1h
  chart:
    spec:
      chart: metrics-server
      version: "3.13.0"
      sourceRef:
        kind: HelmRepository
        name: metrics-server
        namespace: system
      interval: 10m
  upgrade:
    remediation:
      remediateLastFailure: true
  values:
    rbac:
      create: true
    apiService:
      create: true
    args:
      - --kubelet-preferred-address-types=InternalDNS,Hostname,InternalIP
      - --kubelet-insecure-tls
