apiVersion: v1
kind: Namespace
metadata:
  name: flux-my-rest-api
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: k8s-playground
  namespace: flux-my-rest-api
spec:
  interval: 5m
  url: https://github.com/gerardVM/k8s-playground.git
  ref:
    branch: main
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: my-rest-api
  namespace: flux-my-rest-api
spec:
  interval: 10m
  timeout: 5m
  chart:
    spec:
      chart: ./charts/my-rest-api
      sourceRef:
        kind: GitRepository
        name: k8s-playground
      interval: 5m
  releaseName: my-rest-api
  values:
    replicaCount: 2
    env:
      listenHost: 0.0.0.0
      listenPort: 5678
    image:
      repository: hashicorp/http-echo
      tag: latest
      pullPolicy: IfNotPresent
      containerPort: 5678
      args:
        - "-text=Hello from my-api flux environment!"
    service:
      type: ClusterIP
      port: 5678
    ingress:
      enabled: true
      className: traefik
      annotations: 
        nginx.ingress.kubernetes.io/rewrite-target: /
      hosts:
        - host: flux.k8s-playground.gerardvm.tech
          paths:
            - path: /
              pathType: Prefix
