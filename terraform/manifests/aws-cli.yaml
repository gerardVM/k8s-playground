apiVersion: apps/v1
kind: Deployment
metadata:
  name: aws-cli
  namespace: system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aws-cli
  template:
    metadata:
      labels:
        app: aws-cli
    spec:
      containers:
        - name: aws-cli
          image: public.ecr.aws/aws-cli/aws-cli:latest
          command: ["/bin/sh"]
          args: ["-c", "sleep infinity"]
          envFrom:
            - secretRef:
                name: aws-credentials
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      restartPolicy: Always
